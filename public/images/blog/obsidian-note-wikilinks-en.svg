<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <style>
      .body { fill: #C8CEDC; font-size: 17px; }
      .link { fill: #2EE6A6; }
      .dim { fill: #55607A; }
      .edge { stroke: #2E3A5C; stroke-width: 1.4; }
      .lbl { fill: #8B93A7; font-size: 13px; text-anchor: middle; }
    </style>
  </defs>

  <!-- window -->
  <rect x="0" y="0" width="1200" height="640" rx="16" fill="#0B132B"/>
  <rect x="0.5" y="0.5" width="1199" height="639" rx="16" fill="none" stroke="#243052"/>
  <rect x="0" y="0" width="1200" height="46" rx="16" fill="#101A38"/>
  <rect x="0" y="30" width="1200" height="16" fill="#101A38"/>
  <circle cx="30" cy="23" r="6" fill="#FF5F57"/>
  <circle cx="52" cy="23" r="6" fill="#FEBC2E"/>
  <circle cx="74" cy="23" r="6" fill="#28C840"/>
  <text x="340" y="28" text-anchor="middle" fill="#C8CEDC" font-size="14">k8s-rollback-runbook.md</text>
  <text x="940" y="28" text-anchor="middle" fill="#8B93A7" font-size="14">local graph</text>
  <line x1="680" y1="46" x2="680" y2="640" stroke="#243052"/>

  <!-- note pane -->
  <text x="50" y="110" fill="#F5F7FA" font-size="28" font-weight="700">k8s-rollback-runbook</text>
  <rect x="50" y="132" width="104" height="28" rx="14" fill="#2EE6A6" opacity="0.12"/>
  <text x="102" y="151" text-anchor="middle" class="link" font-size="14">#kubernetes</text>
  <rect x="164" y="132" width="84" height="28" rx="14" fill="#2EE6A6" opacity="0.12"/>
  <text x="206" y="151" text-anchor="middle" class="link" font-size="14">#runbook</text>

  <text x="50" y="215" class="body">Before any production rollback:</text>
  <text x="50" y="260" class="body"><tspan class="dim">-</tspan> check the deploy window in <tspan class="link">[[deploy-freeze-policy]]</tspan></text>
  <text x="50" y="300" class="body"><tspan class="dim">-</tspan> if it is an incident, follow the <tspan class="link">[[sev1-checklist]]</tspan></text>
  <text x="50" y="340" class="body"><tspan class="dim">-</tspan> ready-to-run commands in <tspan class="link">[[helm-rollback-cmds]]</tspan></text>
  <text x="50" y="400" class="body">Never roll back a database migration</text>
  <text x="50" y="428" class="body">without checking <tspan class="link">[[db-migration-rules]]</tspan>.</text>

  <line x1="50" y1="475" x2="630" y2="475" stroke="#243052"/>
  <text x="50" y="515" class="body"><tspan class="dim">Related:</tspan> <tspan class="link">[[moc-kubernetes]]</tspan></text>

  <!-- local graph pane -->
  <g class="edge">
    <line x1="940" y1="330" x2="830" y2="190"/>
    <line x1="940" y1="330" x2="1080" y2="215"/>
    <line x1="940" y1="330" x2="835" y2="470"/>
    <line x1="940" y1="330" x2="1075" y2="455"/>
    <line x1="940" y1="330" x2="965" y2="555"/>
  </g>
  <g class="edge" opacity="0.4">
    <line x1="1080" y1="215" x2="1150" y2="120"/>
    <line x1="1075" y1="455" x2="1160" y2="545"/>
  </g>

  <circle cx="940" cy="330" r="34" fill="#2EE6A6" opacity="0.15"/>
  <circle cx="940" cy="330" r="21" fill="#2EE6A6"/>
  <text x="940" y="385" class="lbl" font-size="14" font-weight="600" fill="#C8CEDC">k8s-rollback-runbook</text>

  <circle cx="830" cy="190" r="10" fill="#9B7BFF" opacity="0.9"/>
  <text x="830" y="168" class="lbl">deploy-freeze-policy</text>
  <circle cx="1080" cy="215" r="10" fill="#FF6B8A" opacity="0.9"/>
  <text x="1080" y="193" class="lbl">sev1-checklist</text>
  <circle cx="835" cy="470" r="10" fill="#2EE6A6" opacity="0.9"/>
  <text x="835" y="497" class="lbl">helm-rollback-cmds</text>
  <circle cx="1075" cy="455" r="10" fill="#00E5FF" opacity="0.9"/>
  <text x="1075" y="482" class="lbl">db-migration-rules</text>
  <circle cx="965" cy="555" r="13" fill="#2EE6A6" opacity="0.9"/>
  <text x="965" y="585" class="lbl">moc-kubernetes</text>
  <circle cx="1150" cy="120" r="6" fill="#FF6B8A" opacity="0.5"/>
  <circle cx="1160" cy="545" r="6" fill="#00E5FF" opacity="0.5"/>
</svg>
