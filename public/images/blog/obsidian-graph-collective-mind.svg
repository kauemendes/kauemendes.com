<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <style>
      .edge { stroke: #2E3A5C; stroke-width: 1.4; }
      .edge-x { stroke: #3D4E7A; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .lbl { fill: #8B93A7; font-size: 13px; text-anchor: middle; }
      .lbl-hub { fill: #C8CEDC; font-size: 14px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <!-- window -->
  <rect x="0" y="0" width="1200" height="720" rx="16" fill="#0B132B"/>
  <rect x="0.5" y="0.5" width="1199" height="719" rx="16" fill="none" stroke="#243052"/>
  <rect x="0" y="0" width="1200" height="46" rx="16" fill="#101A38"/>
  <rect x="0" y="30" width="1200" height="16" fill="#101A38"/>
  <circle cx="30" cy="23" r="6" fill="#FF5F57"/>
  <circle cx="52" cy="23" r="6" fill="#FEBC2E"/>
  <circle cx="74" cy="23" r="6" fill="#28C840"/>
  <text x="600" y="28" text-anchor="middle" fill="#8B93A7" font-size="14">collective-mind — graph view</text>

  <!-- edges: center to hubs -->
  <g class="edge" opacity="0.9">
    <line x1="600" y1="380" x2="340" y2="270"/>
    <line x1="600" y1="380" x2="870" y2="240"/>
    <line x1="600" y1="380" x2="920" y2="490"/>
    <line x1="600" y1="380" x2="460" y2="555"/>
    <line x1="600" y1="380" x2="650" y2="190"/>
  </g>
  <!-- edges: hub to notes -->
  <g class="edge" opacity="0.75">
    <line x1="340" y1="270" x2="205" y2="195"/>
    <line x1="340" y1="270" x2="255" y2="345"/>
    <line x1="340" y1="270" x2="415" y2="165"/>
    <line x1="340" y1="270" x2="155" y2="275"/>
    <line x1="870" y1="240" x2="985" y2="160"/>
    <line x1="870" y1="240" x2="965" y2="315"/>
    <line x1="870" y1="240" x2="785" y2="140"/>
    <line x1="920" y1="490" x2="1045" y2="430"/>
    <line x1="920" y1="490" x2="1020" y2="570"/>
    <line x1="920" y1="490" x2="845" y2="600"/>
    <line x1="460" y1="555" x2="335" y2="625"/>
    <line x1="460" y1="555" x2="575" y2="645"/>
    <line x1="460" y1="555" x2="305" y2="505"/>
    <line x1="650" y1="190" x2="745" y2="105"/>
    <line x1="650" y1="190" x2="560" y2="95"/>
  </g>
  <!-- cross-domain links -->
  <g class="edge-x" opacity="0.8">
    <line x1="205" y1="195" x2="305" y2="505"/>
    <line x1="335" y1="625" x2="205" y2="195"/>
    <line x1="785" y1="140" x2="335" y2="625"/>
    <line x1="560" y1="95" x2="340" y2="270"/>
    <line x1="1045" y1="430" x2="965" y2="315"/>
  </g>
  <!-- agent links -->
  <g class="edge" opacity="0.6">
    <line x1="150" y1="430" x2="340" y2="270"/>
    <line x1="185" y1="570" x2="460" y2="555"/>
  </g>

  <!-- center hub -->
  <circle cx="600" cy="380" r="44" fill="#2EE6A6" opacity="0.15"/>
  <circle cx="600" cy="380" r="27" fill="#2EE6A6"/>
  <circle cx="600" cy="380" r="14" fill="#0B132B"/>
  <circle cx="600" cy="380" r="7" fill="#2EE6A6"/>
  <text x="600" y="440" class="lbl-hub">00-index</text>

  <!-- kubernetes cluster (green) -->
  <circle cx="340" cy="270" r="28" fill="#2EE6A6" opacity="0.15"/>
  <circle cx="340" cy="270" r="17" fill="#2EE6A6"/>
  <text x="340" y="242" class="lbl-hub">moc-kubernetes</text>
  <circle cx="205" cy="195" r="9" fill="#2EE6A6" opacity="0.85"/>
  <text x="205" y="176" class="lbl">k8s-rollback-runbook</text>
  <circle cx="255" cy="345" r="8" fill="#2EE6A6" opacity="0.85"/>
  <text x="255" y="370" class="lbl">ingress-tls-renewal</text>
  <circle cx="415" cy="165" r="8" fill="#2EE6A6" opacity="0.85"/>
  <text x="415" y="147" class="lbl">hpa-tuning</text>
  <circle cx="155" cy="275" r="8" fill="#2EE6A6" opacity="0.85"/>
  <text x="155" y="300" class="lbl">pod-oom-debug</text>

  <!-- aws cluster (orange) -->
  <circle cx="870" cy="240" r="28" fill="#FF7A00" opacity="0.15"/>
  <circle cx="870" cy="240" r="17" fill="#FF7A00"/>
  <text x="870" y="212" class="lbl-hub">moc-aws</text>
  <circle cx="985" cy="160" r="8" fill="#FF7A00" opacity="0.85"/>
  <text x="985" y="142" class="lbl">iam-least-privilege</text>
  <circle cx="965" cy="315" r="8" fill="#FF7A00" opacity="0.85"/>
  <text x="965" y="340" class="lbl">s3-lifecycle-rules</text>
  <circle cx="785" cy="140" r="9" fill="#FF7A00" opacity="0.85"/>
  <text x="785" y="122" class="lbl">rds-failover-playbook</text>

  <!-- terraform cluster (cyan) -->
  <circle cx="920" cy="490" r="28" fill="#00E5FF" opacity="0.15"/>
  <circle cx="920" cy="490" r="17" fill="#00E5FF"/>
  <text x="920" y="462" class="lbl-hub">moc-terraform</text>
  <circle cx="1045" cy="430" r="8" fill="#00E5FF" opacity="0.85"/>
  <text x="1045" y="412" class="lbl">tf-state-locking</text>
  <circle cx="1020" cy="570" r="8" fill="#00E5FF" opacity="0.85"/>
  <text x="1020" y="595" class="lbl">module-versioning</text>
  <circle cx="845" cy="600" r="8" fill="#00E5FF" opacity="0.85"/>
  <text x="845" y="625" class="lbl">drift-detection</text>

  <!-- incidents cluster (pink) -->
  <circle cx="460" cy="555" r="28" fill="#FF6B8A" opacity="0.15"/>
  <circle cx="460" cy="555" r="17" fill="#FF6B8A"/>
  <text x="460" y="527" class="lbl-hub">moc-incidents</text>
  <circle cx="335" cy="625" r="9" fill="#FF6B8A" opacity="0.85"/>
  <text x="335" y="650" class="lbl">sev1-checklist</text>
  <circle cx="575" cy="645" r="8" fill="#FF6B8A" opacity="0.85"/>
  <text x="575" y="670" class="lbl">postmortem-template</text>
  <circle cx="305" cy="505" r="8" fill="#FF6B8A" opacity="0.85"/>
  <text x="305" y="490" class="lbl">oncall-handoff</text>

  <!-- ci/cd cluster (purple) -->
  <circle cx="650" cy="190" r="28" fill="#9B7BFF" opacity="0.15"/>
  <circle cx="650" cy="190" r="17" fill="#9B7BFF"/>
  <text x="700" y="205" class="lbl-hub" text-anchor="start">moc-cicd</text>
  <circle cx="745" cy="105" r="8" fill="#9B7BFF" opacity="0.85"/>
  <text x="745" y="87" class="lbl">pipeline-variables</text>
  <circle cx="560" cy="95" r="8" fill="#9B7BFF" opacity="0.85"/>
  <text x="560" y="77" class="lbl">blue-green-deploy</text>

  <!-- agents (squares) -->
  <rect x="141" y="421" width="18" height="18" rx="4" fill="#C8CEDC"/>
  <text x="150" y="460" class="lbl">agent-k8s-operator</text>
  <rect x="176" y="561" width="18" height="18" rx="4" fill="#C8CEDC"/>
  <text x="185" y="600" class="lbl">agent-incident-scribe</text>

  <!-- stats -->
  <text x="1160" y="695" text-anchor="end" fill="#55607A" font-size="13">225 notes · 10 domains · 16 agents</text>
</svg>
